<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f8f8f8">
    <meta name="description" content="Viaggi — foto di Paolo Pirruccio">
    <title>Viaggi — Paolo Pirruccio</title>
    <link rel="stylesheet" href="stylelinks.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Caveat:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/webp" href="icon.webp">
    <link rel="apple-touch-icon" href="icon.webp">
</head>

<body>
    <div class="main-container">
        <div class="nav-header">
            <a href="index.html" class="back-button">
                <i class="fa-solid fa-arrow-left"></i> Torna al portfolio
            </a>
        </div>

        <header class="viaggi-header">
            <div class="viaggi-airmail" aria-hidden="true"></div>

            <div class="viaggi-deco" aria-hidden="true">
                <div class="viaggi-stamp">
                    <span class="viaggi-stamp-art">🧭</span>
                    <span class="viaggi-stamp-val">PAR AVION</span>
                </div>
                <div class="viaggi-postmark">
                    <span class="viaggi-postmark-top">✦ POSTE ✦</span>
                    <span class="viaggi-postmark-mid">VIAGGI</span>
                </div>
            </div>

            <p class="viaggi-kicker">Places by Paolo</p>
            <h1 class="viaggi-title">Viaggi</h1>
            <div class="viaggi-rule" aria-hidden="true"></div>
            <p class="viaggi-sub">Posti che ho visto, e l'anno in cui li ho visti.</p>
        </header>

        <div class="polaroid-grid" id="viaggi-list"></div>

        <footer class="site-footer">
            <p>&copy; <span id="current-year"></span> Paolo Pirruccio. All rights reserved.</p>
        </footer>
    </div>

    <script src="viaggi/viaggi.js"></script>
    <script src="version.js"></script>
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
