<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#030305">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bussola">
    <title>Servizi - InfoUma</title>
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/png" href="assets/links.png" />
    <link rel="apple-touch-icon" href="assets/links.png" />
    <link rel="manifest" href="./manifest.json">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vostro-dominio.com/">

        content="La bussola per gli studenti di Informatica Umanistica dell'Università di Pisa. Link utili, aule libere, orari e faq in un unico posto.">
    <meta property="og:image" content="https://vostro-dominio.com/assets/compass.webp">
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://vostro-dominio.com/">
    <meta property="twitter:title" content="Servizi - InfoUma">
    <meta property="twitter:description"
        content="La bussola per gli studenti di Informatica Umanistica dell'Università di Pisa. Link utili, aule libere, orari e faq in un unico posto.">
    <meta property="twitter:image" content="https://vostro-dominio.com/assets/compass.webp">
    <link rel="stylesheet" href="style.css?v=20261008-search-rail-flat">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
</head>

<body class="bussola-page">

    <script src="navbar.js?v=20261008-fab"></script>
    <div class="container page-shell fade-in">
        <header class="links-header page-hero">
            <div class="page-heading links-title-row">
            <picture class="site-logo-container">
                <source srcset="assets/links.webp" media="(prefers-color-scheme: light)">
                <img src="assets/links.webp" alt="InfoUma Logo" class="site-logo">
            </picture>
            <h1 id="greeting" data-i18n="links_h1">Servizi</h1>
            </div>
            <p data-i18n="links_desc">
                Servizi online per Informatica Umanistica.
            </p>
        </header>
        <div class="search-container page-search links-search page-controls">
                <i class="ri-search-line search-icon"></i>
                <input type="text" id="search-input" placeholder="Cerca link..." data-i18n="links_search">
                <i class="ri-close-line search-clear" id="search-clear"></i>
        </div>

        <main id="links-container" class="page-content">
        </main>
        <footer class="site-footer">
            <div class="site-footer-brand">
                <img src="assets/compass.webp" alt="" class="site-footer-icon">
                <span data-i18n="footer_brand">La Bussola di InfoUma</span>
            </div>
            <nav class="footer-legal-links" aria-label="Informazioni legali">
                <a href="https://pirruccio.dev/privacy" data-i18n="privacy_policy">Privacy policy</a>
                <a href="https://pirruccio.dev/bussola/termini" data-i18n="terms_of_use">Termini di utilizzo</a>
            </nav>
            <p class="disclaimer">by <strong>Paolo Pirruccio</strong>.</p>
        </footer>
    </div>
    <script src="script.js?v=20261008-map-categories"></script>
    <script>
    /* ── i18n ── */
    function applyLang(lang) {
        if (window.BussolaI18n) {
            BussolaI18n.applyDataI18n(lang);
        }
        // Re-render dynamic content with the new language
        renderLinks();
    }

    document.addEventListener('DOMContentLoaded', function () {
        const lang = localStorage.getItem('bussola_lang') || 'it';
        if (window.BussolaI18n) BussolaI18n.applyDataI18n(lang);
    });
    </script>
    <div class="scroll-buttons">
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="scroll-btn" title="Torna su">
            <i class="ri-arrow-up-line"></i>
        </button>
    </div>
</body>

</html>
