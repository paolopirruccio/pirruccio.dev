<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&display=swap">
    <link rel="stylesheet" href="css/stile.css">
    <link rel="stylesheet" href="css/overlay_account.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="icon" type="image/webp" href="../blog/icon.webp">
    <link rel="apple-touch-icon" href="../blog/icon.webp">
</head>
<body>
    <!-- Navbar injected via components.js -->
    <div class="contenitore" style="margin-top: 80px;">
        <a href="index.html" class="bottone bottone-torna-home" id="bottoneTornaBlog">
            <i class="fa-solid fa-arrow-left"></i> Torna al Blog
        </a>
        <div class="intestazione">
            <h1><i class="fas fa-edit"></i> Modifica Blog</h1>
            <p class="sottotitolo">Aggiorna le informazioni del tuo blog</p>
        </div>
        <div class="scatola">
            <form id="formModificaBlog">
                <h3><i class="fas fa-heading"></i> Titolo del Blog:</h3>
                <div class="gruppo-form">
                    <input type="text" id="titoloBlog" maxlength="50" required>
                </div>
                <h3><i class="fas fa-quote-right"></i> Tagline:</h3>
                <div class="gruppo-form">
                    <input type="text" id="taglineBlog" maxlength="150" required>
                </div>
                <h3><i class="fas fa-align-left"></i> Descrizione:</h3>
                <div class="gruppo-form">
                    <textarea id="descrizioneBlog" rows="4" maxlength="300" required></textarea>
                </div>
                <h3><i class="fas fa-tags"></i> Categoria:</h3>
                <div class="gruppo-form">
                    <input type="text" id="categoria" maxlength="25" required>
                </div>
                <h3><i class="fas fa-palette"></i> Tema:</h3>
                <div class="gruppo-form">
                    <select id="tema" style="width: 100%; padding: 10px;">
                        <option value="1">Classico (default)</option>
                        <option value="2">Elegante (Premium)</option>
                        <option value="3">Ceruleo (Premium)</option>
                        <option value="4">Naturale (Premium)</option>
                    </select>
                </div>
                <div class="azioni-form">
                    <button type="button" class="bottone bottone-invia" id="btnSalvaModifiche">Salva Modifiche</button>
                    <!-- Per semplicitá il bottone elimina non verra incluso nella mock. -->
                </div>
            </form>
        </div>
    </div>
    <!-- Footer -->
    <footer class="footer">
        <div class="footer-logo">
            <img src="illustrazioni/logo-footer.svg" alt="BlogOwl Logo" class="footer-logo">
        </div>
        <div class="footer-disclaimer">
            Progetto di Basi di Dati e Laboratorio Web 2023/2024.<br>©Paolo Pirruccio (614754) ©Francisco LeYucra
            (659528).
        </div>
    </footer>
    <script src="db.js"></script>
    <script src="mostra_messaggio.js"></script>
    <script src="components/components.js"></script>
    <script src="blog_modifica_logic.js"></script>
</body>
</html>
