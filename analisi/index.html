<title>Domande Analisi di dati</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg:#1c1e26;--surface:#252830;--surface2:#2e3140;--border:#3a3f55;
  --accent:#7b74f0;--accent2:#b0a8ff;
  --green:#4ade80;--gbg:rgba(74,222,128,.1);--gbd:rgba(74,222,128,.3);
  --red:#f87171;--rbg:rgba(248,113,113,.1);--rbd:rgba(248,113,113,.3);
  --text:#dde1f0;--text2:#8b93b0;--r:14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f4f5f9;--surface:#fff;--surface2:#eef0f6;--border:#d8dce8;
    --accent:#5b52e0;--accent2:#7b74f0;
    --green:#16a34a;--gbg:rgba(22,163,74,.08);--gbd:rgba(22,163,74,.3);
    --red:#dc2626;--rbg:rgba(220,38,38,.08);--rbd:rgba(220,38,38,.3);
    --text:#1e2030;--text2:#5a6080;
  }
  .opt.prof-correct{background:rgba(202,138,4,.1);border-color:rgba(202,138,4,.4)}
  .opt.prof-correct .olt{background:#ca8a04;color:#fff}
  .fb.prof{background:rgba(202,138,4,.1);border:1px solid rgba(202,138,4,.4);color:#ca8a04}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.6;min-height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding: calc(20px + var(--safe-top)) 14px calc(60px + var(--safe-bottom));
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}

/* ── HEADER ── */
.hdr{width:100%;max-width:700px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hdr-left{display:flex;align-items:center;gap:8px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}
.score{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700}
.score-item{display:flex;align-items:center;gap:5px;color:var(--text2)}
.score-item span{color:var(--text)}
.track{width:100%;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s ease}
.plbl{font-size:13px;color:var(--text2);text-align:right}

/* icon buttons */
.ibtn{background:var(--surface2);border:1px solid var(--border);border-radius:9px;
  min-width:40px;height:40px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;transition:background .15s;flex-shrink:0;font-size:13px;font-weight:600;color:var(--text2);font-family:inherit}
.ibtn:hover{background:var(--border)}
.ibtn:active{transform:scale(.95)}
.pdf-link{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:11px 18px;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  color:var(--accent2);text-decoration:none;font-size:14px;font-weight:600;
  transition:background .15s,transform .1s}
.pdf-link:hover{background:var(--border)}
.pdf-link:active{transform:scale(.97)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── CARD ── */
.card{width:100%;max-width:700px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:22px 18px;box-shadow:0 2px 12px rgba(0,0,0,.08);animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qmeta{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qnum{background:var(--accent);color:#fff;font-size:11px;font-weight:700;
  padding:4px 11px;border-radius:6px;flex-shrink:0;letter-spacing:.04em}
.qtit{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;line-height:1.4}
.qtxt{font-size:16px;line-height:1.65;font-weight:500;margin-bottom:22px;color:var(--text)}

/* ── OPTIONS ── */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:var(--surface2);
  border:1.5px solid var(--border);border-radius:12px;padding:13px 15px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s;user-select:none;
  min-height:52px;}
.opt:hover:not(.done){border-color:var(--accent);background:rgba(123,116,240,.08)}
.opt:active:not(.done){transform:scale(.985)}
.olt{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--text2);transition:background .2s,color .2s}
.otxt{font-size:15px;line-height:1.5;color:var(--text);flex:1}
.opt.correct{background:var(--gbg);border-color:var(--gbd)}
.opt.correct .olt{background:var(--green);color:#fff}
.opt.wrong{background:var(--rbg);border-color:var(--rbd)}
.opt.prof-correct{background:rgba(234,179,8,.15);border-color:rgba(234,179,8,.4)}
.opt.prof-correct .olt{background:#eab308;color:#fff}
.fb.prof{background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.4);color:#eab308}
.opt.wrong .olt{background:var(--red);color:#fff}
.opt.dim{opacity:.3}.opt.done{cursor:default}

/* ── FEEDBACK ── */
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:14px;
  line-height:1.6;display:none;animation:fi .25s ease}
.fb.show{display:block}
.fb.ok{background:var(--gbg);border:1px solid var(--gbd);color:var(--green)}
.fb.ko{background:var(--rbg);border:1px solid var(--rbd);color:var(--red)}
.fbh{font-weight:700;font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.fbc{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:var(--text2);font-size:14px}
.fbc strong{color:var(--text)}
.fbe{margin-top:10px;padding:11px 14px;background:var(--surface2);border-radius:9px;
  font-size:13.5px;color:var(--text2);line-height:1.55;border:1px solid var(--border);
  display:flex;align-items:flex-start;gap:8px}
.fbe svg{flex-shrink:0;margin-top:2px;width:16px;height:16px;stroke:var(--accent2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── BUTTONS ── */
.bnxt{width:100%;padding:15px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;
  border:none;border-radius:12px;cursor:pointer;font-family:inherit;
  transition:filter .15s,transform .1s;margin-top:16px;display:none;
  min-height:52px}
.bnxt.show{display:block}
.bnxt:hover{filter:brightness(1.1)}.bnxt:active{transform:scale(.985)}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-sec{flex:1;padding:13px 10px;background:var(--surface2);color:var(--text2);
  font-size:14px;font-weight:600;border:1px solid var(--border);border-radius:12px;
  cursor:pointer;font-family:inherit;transition:background .15s;
  display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px}
.btn-sec:hover{background:var(--border)}
.btn-sec svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── START SCREEN ── */
.start{width:100%;max-width:700px;display:flex;flex-direction:column;align-items:center;gap:20px;animation:fi .35s ease}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:36px 24px;text-align:center;width:100%;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.sc-icon{width:80px;height:80px;margin:0 auto 20px;display:block}
.sct{font-size:24px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
.scs{font-size:15px;color:var(--text2);margin-bottom:28px;line-height:1.55}
.mode-row{display:flex;gap:10px;margin-bottom:28px}
.mode-btn{flex:1;padding:16px 10px;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:12px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;min-height:100px}
.mode-btn.sel{border-color:var(--accent);background:rgba(123,116,240,.1)}
.mode-btn svg{width:24px;height:24px;stroke:var(--text2);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto}
.mode-btn.sel svg{stroke:var(--accent2)}
.mode-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.mode-sub{font-size:12px;color:var(--text2);line-height:1.4}
.plbl2{font-size:13px;color:var(--text2);margin-bottom:10px}
.picker{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.pk{padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--border);background:var(--surface2);color:var(--text);
  font-family:inherit;transition:all .15s;min-height:44px}
.pk.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.rnd{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;
  font-size:13.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--text2);font-family:inherit;transition:all .15s;
  min-height:44px;margin-bottom:24px}
.rnd svg{width:16px;height:16px;flex-shrink:0}
.rnd.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.bstart{width:100%;padding:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;
  border:none;border-radius:12px;cursor:pointer;font-family:inherit;transition:filter .15s;min-height:54px}
.bstart:hover{filter:brightness(1.1)}
.info-row{font-size:13px;color:var(--text2);text-align:center}

/* ── FLASHCARD ── */
.fc-hdr{width:100%;max-width:700px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.fc-hdr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#FC{width:100%;max-width:700px;display:none;flex-direction:column;gap:16px;animation:fi .3s ease}
#FC.show{display:flex}
.fc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:22px 18px;box-shadow:0 2px 12px rgba(0,0,0,.08);animation:fi .3s ease}
.fc-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(123,116,240,.15);
  color:var(--accent2);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:4px 10px;border-radius:6px;margin-bottom:14px}
.fc-badge svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fc-nav{display:flex;gap:10px;align-items:center}
.fc-nav-btn{flex:1;padding:14px;background:var(--surface2);color:var(--text);
  font-size:14px;font-weight:600;border:1px solid var(--border);border-radius:12px;
  cursor:pointer;font-family:inherit;transition:background .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.fc-nav-btn:hover:not(:disabled){background:var(--border)}
.fc-nav-btn:disabled{opacity:.35;cursor:default}
.fc-nav-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fc-counter{font-size:13px;color:var(--text2);white-space:nowrap;min-width:55px;text-align:center}

/* ── RESULTS ── */
.results{width:100%;max-width:700px;display:none;flex-direction:column;gap:18px;animation:fi .3s ease}
.results.show{display:flex}
.rc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:28px 22px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.rt{font-size:22px;font-weight:700;margin-bottom:5px}
.rsb{font-size:14px;color:var(--text2);margin-bottom:18px}
.rp{font-size:54px;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;line-height:1;margin-bottom:5px}
.rf{font-size:14px;color:var(--text2)}
.stats{display:flex;gap:12px;justify-content:center;margin-top:18px}
.stat{flex:1;max-width:140px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 8px}
.stn{font-size:24px;font-weight:700}.stn.g{color:var(--green)}.stn.r{color:var(--red)}
.stl{font-size:12px;color:var(--text2);margin-top:3px}
.revhd{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;
  letter-spacing:.08em;padding-bottom:8px;border-bottom:1px solid var(--border)}
.revl{display:flex;flex-direction:column;gap:9px}
.rvi{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:13px 15px;border-left:3px solid var(--border)}
.rvi.ok{border-left-color:var(--green)}.rvi.ko{border-left-color:var(--red)}
.rvq{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
.rva{font-size:13px;color:var(--text2);line-height:1.6}
.vg{color:var(--green)}.vr{color:var(--red)}
.res-btns{display:flex;gap:10px}
.res-btns.top{margin:14px 0 4px}
.bback{display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;box-sizing:border-box}
.bback svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brst{flex:1;padding:15px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;
  border:none;border-radius:12px;cursor:pointer;font-family:inherit;transition:filter .15s;min-height:52px}
.brst:hover{filter:brightness(1.1)}
.bback{flex:1;padding:15px;background:var(--surface2);color:var(--text);font-size:15px;font-weight:600;
  border:1px solid var(--border);border-radius:12px;cursor:pointer;font-family:inherit;
  transition:background .15s;min-height:52px}
.bback:hover{background:var(--border)}

/* mobile tweaks */
@media(max-width:520px){
  body{padding:calc(14px + var(--safe-top)) 12px calc(40px + var(--safe-bottom))}
  .hdr{margin-bottom:14px;gap:9px}
  .card{padding:18px 16px;border-radius:13px}
  .sc{padding:30px 20px}
  .sct{font-size:22px}
  .scs{font-size:14px;margin-bottom:24px}
  .qtxt{font-size:15px;margin-bottom:18px}
  .qnum{font-size:10.5px;padding:3px 9px}
  .qtit{font-size:11.5px}
  .otxt{font-size:14.5px}
  .opt{padding:12px 14px;gap:11px;min-height:48px}
  .olt{width:28px;height:28px;font-size:12.5px}
  .mode-row{gap:8px;margin-bottom:24px}
  .mode-btn{padding:14px 8px;min-height:92px}
  .mode-title{font-size:13.5px}
  .mode-sub{font-size:11.5px}
  .pk{padding:9px 15px;font-size:13.5px;min-height:42px}
  .picker{gap:7px;margin-bottom:20px}
  .stats{gap:8px;margin-top:14px}
  .stat{padding:12px 6px}
  .stn{font-size:22px}
  .res-btns{gap:8px}
  .brst,.bback{padding:14px;font-size:14px}
  .fb{padding:13px 14px;font-size:13.5px}
  .fbe{padding:10px 12px;font-size:13px}
  .pdf-link{font-size:13.5px;padding:10px 16px}
  .ibtn{min-width:38px;height:38px;font-size:12.5px}
}
@media(max-width:380px){
  .sct{font-size:20px}
  .rp{font-size:46px}

function sh(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=0|Math.random()*(i+1);[r[i],r[j]]=[r[j],r[i]];}return r;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hide(...ids){ids.forEach(id=>{const el=document.getElementById(id);if(el){el.style.display='none';el.className=el.className.replace(/\bshow\b/,'').trim();}});}

function backToStart(){hide('QHD','QC','FCHD','RS');document.getElementById('FC').className='';document.getElementById('RS').className='results';show('SS');}

function startSession(){if(mode==='flash'){startFlash();return;}quiz=(sel===ALL.length)?(rnd?sh(ALL):ALL.slice()):sh(ALL).slice(0,sel);cur=0;ok=0;ko=0;hist=[];answered=false;hide('SS');show('QHD');show('QC','block');showQ();}

  document.getElementById('QN').textContent='Q'+(cur+1);

function pick(letter,q){
  if(answered)return;answered=true;
  const good=letter===q.correct_letter;
  if(good)ok++;else ko++;
  document.querySelectorAll('#OP .opt').forEach(o=>{
    o.classList.add('done');const l=o.dataset.l;
    if(l===q.correct_letter)o.classList.add('correct');
    else if(l===letter&&!good)o.classList.add('wrong');
    else o.classList.add('dim');
  });
  const fb=document.getElementById('FB');
  if(good){fb.className='fb ok show';document.getElementById('FBH').innerHTML=ICON_OK+' Corretto!';document.getElementById('FBC').style.display='none';}
  else{fb.className='fb ko show';document.getElementById('FBH').innerHTML=ICON_KO+' Risposta errata';const fbc=document.getElementById('FBC');fbc.style.display='block';fbc.innerHTML='Risposta corretta: <strong>'+esc(q.answers[q.correct_letter])+'</strong>';}
  if(q.explanation){document.getElementById('FBE').style.display='flex';document.getElementById('FBEtxt').textContent=q.explanation;}
  hist.push({q,chosen:letter,good});
  document.getElementById('SC').textContent=ok;document.getElementById('SW').textContent=ko;
  const bn=document.getElementById('BN');bn.className='bnxt show';bn.textContent=cur===quiz.length-1?'Vedi risultati →':'Prossima →';
  document.getElementById('BTN_ROW').style.display='flex';
  setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}

function showResults(){
  hide('QHD','QC');const rs=document.getElementById('RS');rs.style.display='';rs.className='results show';window.scrollTo({top:0,behavior:'smooth'});
  const tot=quiz.length,pct=Math.round(ok/tot*100);
  let title,sub;
  if(pct>=90){title='Eccellente!';sub='Preparazione solida.';}
  else if(pct>=75){title='Ottimo!';sub='Qualche argomento da ripassare.';}
  else if(pct>=60){title='Quasi!';sub='Rivedi gli argomenti errati.';}
  else{title='Da ripassare';sub='Studia ancora e riprova.';}
  document.getElementById('RT').textContent=title;document.getElementById('RSB').textContent=sub;
  document.getElementById('RP').textContent=pct+'%';document.getElementById('RF').textContent=ok+' corrette su '+tot;
  document.getElementById('STC').textContent=ok;document.getElementById('STW').textContent=ko;
  document.querySelectorAll('.repeat-wrong').forEach(b => b.style.display = ko > 0 ? '' : 'none');
  const rl=document.getElementById('RL');rl.innerHTML='';
  hist.forEach((h,i)=>{
    const d=document.createElement('div');d.className='rvi '+(h.good?'ok':'ko');
    const ct=esc(h.q.answers[h.chosen]||'—');const cc=esc(h.q.answers[h.q.correct_letter]||'');
    d.innerHTML=`<div class="rvq">Q${i+1}. ${esc(h.q.title)} — ${esc(h.q.text.substring(0,60))}${h.q.text.length>60?'…':''}</div>
      <div class="rva">${h.good
        ?`<span class="vg">${ICON_OK} ${ct}</span>`
        :`<span class="vr">${ICON_KO} ${ct}</span><br><span class="vg">${ICON_OK} ${cc}</span>`
      }</div>`;
    rl.appendChild(d);
  });
}
function restartFromResults(){restartQuiz();}
function restartWrong(){
  const wrongQs = hist.filter(h => !h.good).map(h => h.q);

function fcNav(dir){if(dir===1&&fcCur===fcDeck.length-1){backToStart();return;}fcCur=Math.max(0,Math.min(fcDeck.length-1,fcCur+dir));renderFlashcard();}
function restartFlash(){fcDeck=(sel===ALL.length)?(rnd?sh(ALL):ALL.slice()):sh(ALL).slice(0,sel);fcCur=0;renderFlashcard();}
function jumpTo(isFlash){
  const tot = isFlash ? fcDeck.length : quiz.length;
  const target = prompt("Vai alla domanda numero (1 - " + tot + "):");
  if(target && !isNaN(target)) {
    const num = parseInt(target) - 1;
    if(num >= 0 && num < tot) {
      if(isFlash) { fcCur = num; renderFlashcard(); }
      else { cur = num; showQ(); }
    } else {
      alert("Numero non valido!");
    }
  }
}

  const ql=q.toLowerCase();
  const list=document.getElementById('SVL');
  const meta=document.getElementById('SVM');

  const res=ql?ALL.map((it,i)=>({it,i})).filter(({it})=>{
    if((it.title||'').toLowerCase().includes(ql))return true;
    if((it.text||'').toLowerCase().includes(ql))return true;
    if((it.explanation||'').toLowerCase().includes(ql))return true;
    return Object.values(it.answers||{}).some(a=>String(a).toLowerCase().includes(ql));
  }):ALL.map((it,i)=>({it,i}));
  meta.textContent=res.length+' / '+ALL.length+' domande';
  if(!res.length){list.innerHTML='<div class="sv-empty">Nessuna domanda trovata.</div>';return;}
  list.innerHTML=res.map(({it,i})=>{
    const ans=Object.keys(it.answers||{}).map((k,j)=>{
      const isC=k===it.correct_letter;
      return `<div class="sv-ans${isC?' correct':''}"><div class="lt">${'ABCDE'[j]}</div><div>${svHL(it.answers[k],q)}</div></div>`;
    }).join('');
    const expl=it.explanation?`<div class="sv-expl">${svHL(it.explanation,q)}</div>`:'';
    return `<div class="sv-item" onclick="this.classList.toggle('open')">
      <div class="sv-item-hdr"><div class="sv-num">Q${i+1}</div><div class="sv-title">${svHL(it.title||'',q)}</div></div>
      <div class="sv-text">${svHL(it.text||'',q)}</div>
      <div class="sv-body">${ans}${expl}</div>
    </div>`;
  }).join('');
}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='SVI')renderSearch(e.target.value);});

// PWA service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
