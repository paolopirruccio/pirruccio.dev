<title>Domande Analisi di dati</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg:#1c1e26;--surface:#252830;--surface2:#2e3140;--border:#3a3f55;
  --accent:#7b74f0;--accent2:#b0a8ff;
  --green:#4ade80;--gbg:rgba(74,222,128,.1);--gbd:rgba(74,222,128,.3);
  --red:#f87171;--rbg:rgba(248,113,113,.1);--rbd:rgba(248,113,113,.3);
  --text:#dde1f0;--text2:#8b93b0;--r:14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f4f5f9;--surface:#fff;--surface2:#eef0f6;--border:#d8dce8;
    --accent:#5b52e0;--accent2:#7b74f0;
    --green:#16a34a;--gbg:rgba(22,163,74,.08);--gbd:rgba(22,163,74,.3);
    --red:#dc2626;--rbg:rgba(220,38,38,.08);--rbd:rgba(220,38,38,.3);
    --text:#1e2030;--text2:#5a6080;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.6;min-height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding: calc(20px + var(--safe-top)) 14px calc(60px + var(--safe-bottom));
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}

/* ── HEADER ── */
.hdr{width:100%;max-width:700px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hdr-left{display:flex;align-items:center;gap:8px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}
.score{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700}
.score-item{display:flex;align-items:center;gap:5px;color:var(--text2)}
.score-item span{color:var(--text)}
.track{width:100%;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s ease}
.plbl{font-size:13px;color:var(--text2);text-align:right}

/* icon buttons */
.ibtn{background:var(--surface2);border:1px solid var(--border);border-radius:9px;
  min-width:40px;height:40px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;transition:background .15s;flex-shrink:0;font-size:13px;font-weight:600;color:var(--text2);font-family:inherit}
.ibtn:hover{background:var(--border)}
.ibtn:active{transform:scale(.95)}
.pdf-link{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:11px 18px;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  color:var(--accent2);text-decoration:none;font-size:14px;font-weight:600;
  transition:background .15s,transform .1s}
.pdf-link:hover{background:var(--border)}
.pdf-link:active{transform:scale(.97)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── CARD ── */
.card{width:100%;max-width:700px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:22px 18px;box-shadow:0 2px 12px rgba(0,0,0,.08);animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qmeta{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qnum{background:var(--accent);color:#fff;font-size:11px;font-weight:700;
  padding:4px 11px;border-radius:6px;flex-shrink:0;letter-spacing:.04em}
.qtit{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;line-height:1.4}
.qtxt{font-size:16px;line-height:1.65;font-weight:500;margin-bottom:22px;color:var(--text)}

/* ── OPTIONS ── */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:var(--surface2);
  border:1.5px solid var(--border);border-radius:12px;padding:13px 15px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s;user-select:none;
  min-height:52px;}
.opt:hover:not(.done){border-color:var(--accent);background:rgba(123,116,240,.08)}
.opt:active:not(.done){transform:scale(.985)}
.olt{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--text2);transition:background .2s,color .2s}
.otxt{font-size:15px;line-height:1.5;color:var(--text);flex:1}
.opt.correct{background:var(--gbg);border-color:var(--gbd)}
.opt.correct .olt{background:var(--green);color:#fff}
.opt.wrong{background:var(--rbg);border-color:var(--rbd)}
.opt.wrong .olt{background:var(--red);color:#fff}
.opt.dim{opacity:.3}.opt.done{cursor:default}

/* ── FEEDBACK ── */
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:14px;
  line-height:1.6;display:none;animation:fi .25s ease}
.fb.show{display:block}
.fb.ok{background:var(--gbg);border:1px solid var(--gbd);color:var(--green)}
.fb.ko{background:var(--rbg);border:1px solid var(--rbd);color:var(--red)}
.fbh{font-weight:700;font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.fbc{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:var(--text2);font-size:14px}
.fbc strong{color:var(--text)}
.fbe{margin-top:10px;padding:11px 14px;background:var(--surface2);border-radius:9px;
  font-size:13.5px;color:var(--text2);line-height:1.55;border:1px solid var(--border);
  display:flex;align-items:flex-start;gap:8px}
.fbe svg{flex-shrink:0;margin-top:2px;width:16px;height:16px;stroke:var(--accent2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── BUTTONS ── */
.bnxt{width:100%;padding:15px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;
  border:none;border-radius:12px;cursor:pointer;font-family:inherit;
  transition:filter .15s,transform .1s;margin-top:16px;display:none;
  min-height:52px}
.bnxt.show{display:block}
.bnxt:hover{filter:brightness(1.1)}.bnxt:active{transform:scale(.985)}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-sec{flex:1;padding:13px 10px;background:var(--surface2);color:var(--text2);
  font-size:14px;font-weight:600;border:1px solid var(--border);border-radius:12px;
  cursor:pointer;font-family:inherit;transition:background .15s;
  display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px}
.btn-sec:hover{background:var(--border)}
.btn-sec svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── START SCREEN ── */
.start{width:100%;max-width:700px;display:flex;flex-direction:column;align-items:center;gap:20px;animation:fi .35s ease}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:36px 24px;text-align:center;width:100%;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.sc-icon{width:80px;height:80px;margin:0 auto 20px;display:block}
.sct{font-size:24px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
.scs{font-size:15px;color:var(--text2);margin-bottom:28px;line-height:1.55}
.mode-row{display:flex;gap:10px;margin-bottom:28px}
.mode-btn{flex:1;padding:16px 10px;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:12px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;min-height:100px}
.mode-btn.sel{border-color:var(--accent);background:rgba(123,116,240,.1)}
.mode-btn svg{width:24px;height:24px;stroke:var(--text2);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto}
.mode-btn.sel svg{stroke:var(--accent2)}
.mode-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.mode-sub{font-size:12px;color:var(--text2);line-height:1.4}
.plbl2{font-size:13px;color:var(--text2);margin-bottom:10px}
.picker{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.pk{padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--border);background:var(--surface2);color:var(--text);
  font-family:inherit;transition:all .15s;min-height:44px}
.pk.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.bstart{width:100%;padding:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;
  border:none;border-radius:12px;cursor:pointer;font-family:inherit;transition:filter .15s;min-height:54px}
.bstart:hover{filter:brightness(1.1)}
.info-row{font-size:13px;color:var(--text2);text-align:center}

/* ── FLASHCARD ── */
.fc-hdr{width:100%;max-width:700px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.fc-hdr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#FC{width:100%;max-width:700px;display:none;flex-direction:column;gap:16px;animation:fi .3s ease}
#FC.show{display:flex}
.fc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:22px 18px;box-shadow:0 2px 12px rgba(0,0,0,.08);animation:fi .3s ease}
.fc-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(123,116,240,.15);
  color:var(--accent2);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:4px 10px;border-radius:6px;margin-bottom:14px}
.fc-badge svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fc-nav{display:flex;gap:10px;align-items:center}
.fc-nav-btn{flex:1;padding:14px;background:var(--surface2);color:var(--text);
  font-size:14px;font-weight:600;border:1px solid var(--border);border-radius:12px;
  cursor:pointer;font-family:inherit;transition:background .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.fc-nav-btn:hover:not(:disabled){background:var(--border)}
.fc-nav-btn:disabled{opacity:.35;cursor:default}
.fc-nav-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fc-counter{font-size:13px;color:var(--text2);white-space:nowrap;min-width:55px;text-align:center}

/* ── RESULTS ── */
.results{width:100%;max-width:700px;display:none;flex-direction:column;gap:18px;animation:fi .3s ease}
.results.show{display:flex}
.rc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:28px 22px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.rt{font-size:22px;font-weight:700;margin-bottom:5px}
.rsb{font-size:14px;color:var(--text2);margin-bottom:18px}
.rp{font-size:54px;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;line-height:1;margin-bottom:5px}
.rf{font-size:14px;color:var(--text2)}
.stats{display:flex;gap:12px;justify-content:center;margin-top:18px}
.stat{flex:1;max-width:140px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 8px}
.stn{font-size:24px;font-weight:700}.stn.g{color:var(--green)}.stn.r{color:var(--red)}
.stl{font-size:12px;color:var(--text2);margin-top:3px}
.revhd{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;
  letter-spacing:.08em;padding-bottom:8px;border-bottom:1px solid var(--border)}
.revl{display:flex;flex-direction:column;gap:9px}
.rvi{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:13px 15px;border-left:3px solid var(--border)}
.rvi.ok{border-left-color:var(--green)}.rvi.ko{border-left-color:var(--red)}
.rvq{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
.rva{font-size:13px;color:var(--text2);line-height:1.6}
.vg{color:var(--green)}.vr{color:var(--red)}
.res-btns{display:flex;gap:10px}
.brst{flex:1;padding:15px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;
  border:none;border-radius:12px;cursor:pointer;font-family:inherit;transition:filter .15s;min-height:52px}
.brst:hover{filter:brightness(1.1)}
.bback{flex:1;padding:15px;background:var(--surface2);color:var(--text);font-size:15px;font-weight:600;
  border:1px solid var(--border);border-radius:12px;cursor:pointer;font-family:inherit;
  transition:background .15s;min-height:52px}
.bback:hover{background:var(--border)}

/* mobile tweaks */
@media(max-width:520px){
  body{padding:calc(14px + var(--safe-top)) 12px calc(40px + var(--safe-bottom))}
  .hdr{margin-bottom:14px;gap:9px}
  .card{padding:18px 16px;border-radius:13px}
  .sc{padding:30px 20px}
  .sct{font-size:22px}
  .scs{font-size:14px;margin-bottom:24px}
  .qtxt{font-size:15px;margin-bottom:18px}
  .qnum{font-size:10.5px;padding:3px 9px}
  .qtit{font-size:11.5px}
  .otxt{font-size:14.5px}
  .opt{padding:12px 14px;gap:11px;min-height:48px}
  .olt{width:28px;height:28px;font-size:12.5px}
  .mode-row{gap:8px;margin-bottom:24px}
  .mode-btn{padding:14px 8px;min-height:92px}
  .mode-title{font-size:13.5px}
  .mode-sub{font-size:11.5px}
  .pk{padding:9px 15px;font-size:13.5px;min-height:42px}
  .picker{gap:7px;margin-bottom:20px}
  .stats{gap:8px;margin-top:14px}
  .stat{padding:12px 6px}
  .stn{font-size:22px}
  .res-btns{gap:8px}
  .brst,.bback{padding:14px;font-size:14px}
  .fb{padding:13px 14px;font-size:13.5px}
  .fbe{padding:10px 12px;font-size:13px}
  .pdf-link{font-size:13.5px;padding:10px 16px}
  .ibtn{min-width:38px;height:38px;font-size:12.5px}
}
@media(max-width:380px){
  .sct{font-size:20px}
  .rp{font-size:46px}
  .mode-btn{padding:12px 6px;min-height:84px}
  .ibtn span{display:none}
}
.search-view{max-width:760px;margin:0 auto;padding:18px 16px 80px;color:var(--text)}
.sv-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sv-hdr .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}
.sv-input-wrap{position:relative;display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.sv-ico{width:18px;height:18px;color:var(--text2);flex-shrink:0;margin-right:8px;stroke:var(--text2)}
#SVI{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--text);min-width:0}
#SVI::placeholder{color:var(--text2);opacity:.7}
.sv-clear{background:transparent;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--text2);padding:0 4px}
.sv-meta{margin:12px 2px 8px;font-size:13px;color:var(--text2)}
.sv-list{display:flex;flex-direction:column;gap:12px}
.sv-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .12s, background .12s;color:var(--text)}
.sv-item:hover{border-color:var(--accent);background:var(--surface2)}

mark{background:rgba(176,168,255,.35);color:var(--text);padding:0 3px;border-radius:3px}

<script>
const ALL=[{"title": "Algebra Relazionale", "text": "Come può essere meglio tradotta la seguente espressione in algebra relazionale?", "answers": {"a": "Selezionare il \"Nome\" e \"Cognome\" in ordine decrescente dei soli studenti che hanno almeno un esame con voto maggiore di 25.", "b": "Selezionare il \"Nome\" e \"Cognome\" dei soli studenti che hanno tutti gli esami con voto maggiore o uguale di 25.", "c": "Selezionare il \"Nome\" e \"Cognome\" dei soli studenti che hanno tutti gli esami con voto maggiore o uguale di 25 e minore di 30.", "d": "Selezionare il \"Nome\" e \"Cognome\" dei soli studenti che hanno almeno un esame con voto maggiore o uguale di 25."}, "correct_letter": "d", "explanation": "Il Join ( ) unisce studenti ed esami, la Selezione ( ) filtra le righe con voto . Poiché è un join, basta che una riga soddisfi la condizione per far apparire lo studente nel risultato finale (Proiezione )."}, {"title": "Grafici per relazioni", "text": "Se abbiamo un campione che riporta per ciascuna famiglia le entrate mensili e le spese che tipo di grafico possiamo usare per studiarne la relazione?", "answers": {"a": "Lo scatter plot", "b": "La Heatmap", "c": "Il boxplot", "d": "Il pair plot"}, "correct_letter": "a", "explanation": "Lo scatter plot (grafico a dispersione) è lo standard per visualizzare la relazione/correlazione tra due variabili numeriche (entrate vs spese). 3. Coefficiente Domanda: Il calcolo del coefficiente di determinazione misura: Tutte le risposte: ● a. la percentuale di variazione della variabile dipendente spiegata dalla variazione della variabile indipendente ● b. la percentuale di variazione della variabile indipendente spiegata dalla variazione della variabile dipendente ● c. la percentuale di variazione della variabile dipendente spiegata dalla variazione del coefficiente ● d. la percentuale di variazione della variabile indipendente spiegata dalla variazione del coefficiente Risposta Corretta: la percentuale di variazione della variabile dipendente spiegata dalla variazione della variabile indipendente Spiegazione Lampo: Indica quanto bene il modello (variabile indipendente X) riesce a prevedere o \"spiegare\" i dati reali (variabile dipendente Y). spiegato."}, {"title": "Seaborn Boxplot Orizzontale", "text": "Volendo rappresentare (dalla libreria seaborn importata come sns) in forma di boxplot orizzontali due distribuzioni di due colonne di un dataset chiamate age e fare rispettivamente, quale dei seguenti comandi è corretto:", "answers": {"a": "sns.boxplot(data=df[[\"age\", \"fare\"]], orient=\"v\")", "b": "sns.boxplot(data=df[\"age\", \"fare\"], orient=\"h\")", "c": "sns.boxplot(data=df[[\"age\", \"fare\"]], orient=\"h\")", "d": "sns.boxplot(data=df[[\"age\"+\"fare\"]], orient=\"h\")"}, "correct_letter": "c", "explanation": "Bisogna passare le colonne come lista (doppia parentesi quadra [[...]]) e specificare orient=\"h\" per renderli orizzontali (horizontal)."}, {"title": "Bias vs Varianza", "text": "Qual è la differenza tra Bias e Varianza?", "answers": {"a": "Il Bias descrive un errore \"sistematico\"... La varianza rappresenta un errore \"variabile\"...", "b": "Il Bias descrive un errore \"occasionale\"... La varianza rappresenta un errore \"sistematico\"...", "c": "La Varianza descrive un errore \"sistematico\"... Il Bias rappresenta un errore \"variabile\"...", "d": "Il Bias descrive un errore occasionale, la Varianza un errore pregiudiziale..."}, "correct_letter": "a", "explanation": "Bias alto = modello troppo semplice (Underfitting). Varianza alta = modello troppo complesso che segue il \"rumore\" dei dati (Overfitting)."}, {"title": "Istogramma", "text": "In un istogramma di frequenza ad ogni categoria è associato un rettangolo. Quali delle seguenti affermazioni non è vera?", "answers": {"a": "l'area del rettangolo è per costruzione la frequenza (assoluta o relativa) associata alla classe", "b": "l'altezza del rettangolo è pari alla densità di frequenza", "c": "la base del rettangolo è le Qualitativa Ordinale", "text": "Quando una variabile è qualitativa ordinale?", "answers": {"a": "Quando può assumere valori che sono numeri...", "b": "Quando può assumere valori che rientrano in categorie o classi ordinate", "c": "Quando i valori che può assumere sono numeri discreti", "d": "Quando può assumere valori che rientrano in categorie o classi non ordinate"}, "correct_letter": "d", "explanation": "ATTENZIONE! Qui c'è un errore nel database del prof. Teoricamente \"Ordinale\" significa ordinato (es. titolo di studio). Il sistema però segna come corretta \"non ordinate\". Impara la risposta del sistema per passare l'esame, anche se teoricamente imprecisa."}, {"title": "Modalità", "text": "Cosa è la modalità di una variabile?", "answers": {"a": "è il fenomeno... oggetto di indagine", "b": "è ognuno dei modi in cui si può manifestare la caratteristica negli individui della popolazione", "c": "è la modalità con cui si presenta la caratteristica nell'unità statistica u", "d": "è una parte rappresentativa della popolazione..."}, "correct_letter": "b", "explanation": "Esempio: Variabile = \"Colore occhi\". Modalità = \"Verdi\", \"Azzurri\", \"Marroni\" (i modi in cui si manifesta)."}, {"title": "Matplotlib Rotazione", "text": "Che effetto ha sul grafico il seguente comando di matplotlib.pyplot: plt.xticks(rotation=-45)?", "answers": {"a": "Ruotare di -45 gradi le etichette specificate con xlabels sull'asse X", "b": "Ruotare di -45 gradi le etichette specificate con ylabels sull'asse X", "c": "Ruotare di -45 gradi le etichette specificate con ylabels sull'asse Y", "d": "Ruotare di -45 gradi le etichette specificate con xlabels sull'asse Y"}, "correct_letter": "a", "explanation": "xticks controlla le \"tacchette\" (etichette) dell'asse X. Il parametro rotation le inclina per renderle leggibili se sono lunghe."}, {"title": "Retta di Regressione", "text": "La retta di regressione è descritta da una equazione :", "answers": {"a": "dove y è la variabile indipendente...", "b": "dove y è la variabile dipendente e x la variabile indipendente: a e b i coefficienti, rispettivamente il termine costante e b il coefficiente angolare (slope)", "c": "dove y è la variabile indipendente...", "d": "dove y è la variabile indipendente..."}, "correct_letter": "b", "explanation": "Y dipende da X. a è l'intercetta (punto di partenza), b è la pendenza (quanto cresce Y per ogni unità di X)."}, {"title": "Covarianza - Limitazioni", "text": "Cosa non è una limitazione della misura di covarianza?", "answers": {"a": "E' la sua dipendenza dall'unità di misura usata per i valori", "b": "Che è una misura relativa rispetto all'unità di misura scelta", "c": "che possiamo gonfiare il fattore covarianza...", "d": "Che un valore positivo indica una variazione di X e Y nella stessa direzione, un valore negativo l'opposto"}, "correct_letter": "d", "explanation": "Questa non è una limitazione, ma la funzione stessa della covarianza (dirci la direzione della relazione). Le altre sono limitazioni perché la covarianza non è normalizzata (dipende dalla scala dei dati)."}, {"title": "SQL Injection", "text": "Cosa si intende con \"SQL Injection\" nel contesto della sicurezza informatica?", "answers": {"a": "Un attacco informatico che prevede la manipolazione di un DBMS...", "b": "Un attacco informatico che prevede l'aggiunta di record...", "c": "Un attacco informatico che prevede l'ignezione di SQL in una pagina web non interattiva", "d": "Un attacco informatico che prevede l'ignezione di codice SQL attraverso campi di input testuali o numerici"}, "correct_letter": "d", "explanation": "Gli hacker inseriscono comandi SQL malevoli nei form di un sito (es. nel campo login) per ingannare il database e farsi dare dati riservati."}, {"title": "Varianza Pandas (Campionaria vs Popolazione)", "text": "Qual è la differenza tra la varianza campionaria e quella della popolazione in Pandas?", "answers": {"a": "La varianza campionaria si basa su tutti i valori...", "b": "La varianza campionaria è calcolata usando la funzione var()...", "c": "La varianza campionaria è sempre maggiore...", "d": "La varianza campionaria è calcolata dividendo per n-1, mentre quella della popolazione è calcolata dividendo per n."}, "correct_letter": "d", "explanation": "Pandas calcola di default la varianza campionaria (divide per n-1, correzione di Bessel) per avere una stima meno distorta."}, {"title": "DBMS", "text": "Che cos'è un DBMS?", "answers": {"a": "Un sistema software per la gestione di basi di dati.", "b": "Una base di dati.", "c": "Uno strumento per l'analisi dei dati.", "d": "Una istanza di basi di dati."}, "correct_letter": "a", "explanation": "DBMS = Database Management System. È il programma (es. MySQL, Oracle) che gestisce i dati, non i dati stessi."}, {"title": "Indice di Correlazione 0", "text": "L'indice di correlazione con valore 0 indica che:", "answers": {"a": "Solo che le due variabili sono linearmente indipendenti", "b": "La relazione tra i dati è quadratica", "c": "Indica che le due variabili sono linearmente indipendenti o che potrebbero essere non linearmente dipendenti", "d": "L'indice può risultare vicino a 0 solo se esiste una relazione non lineare..."}, "correct_letter": "c", "explanation": "La correlazione (Pearson) misura solo legami lineari (rette). Se è 0, non c'è una retta, ma potrebbe esserci una parabola o un cerchio (relazione non lineare)."}, {"title": "Seaborn Hue", "text": "Nel comando sns.barplot cosa rappresenta il parametro Hue?", "answers": {"a": "Quale colore delle barre viene preso...", "b": "Quale colonna del dataset rappresenta il colore delle barre", "c": "Il parametro esclude le colonne...", "d": "Quale palette di colori viene usata..."}, "correct_letter": "b", "explanation": "Hue (tonalità) permette di aggiungere una terza dimensione al grafico, colorando le barre in base a una categoria specifica (es. Maschi/Femmine)."}, {"title": "Definizione Covarianza", "text": "Cosa è la co-varianza?", "answers": {"a": "L let quiz=[],cur=0,ok=0,ko=0,hist=[],answered=false,sel=36,mode='quiz';
let fcDeck=[],fcCur=0;
const COUNTS=[10,20,36,50];

(function(){
  document.getElementById('tot').textContent=ALL.length;
  const pk=document.getElementById('PK');
  const vals=[...new Set([...COUNTS.map(n=>Math.min(n,ALL.length)),ALL.length])];
  vals.forEach(n=>{
    const b=document.createElement('button');
    b.className='pk'+(n===Math.min(36,ALL.length)?' sel':'');
    b.textContent=n===ALL.length?'Tutte ('+n+')':n+' domande';
    b.dataset.v=n;
    b.onclick=function(){
      document.querySelectorAll('.pk').forEach(x=>x.classList.remove('sel'));
      this.classList.add('sel'); sel=+this.dataset.v;
    };
    pk.appendChild(b);
  });
  sel=Math.min(36,ALL.length);
})();

function setMode(m){mode=m;document.getElementById('modeQuiz').classList.toggle('sel',m==='quiz');document.getElementById('modeFlash').classList.toggle('sel',m==='flash');}
function sh(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=0|Math.random()*(i+1);[r[i],r[j]]=[r[j],r[i]];}return r;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hide(...ids){ids.forEach(id=>{const el=document.getElementById(id);if(el){el.style.display='none';el.className=el.className.replace(/\bshow\b/,'').trim();}});}
function show(id,d='flex'){document.getElementById(id).style.display=d;}

function backToStart(){hide('QHD','QC','FCHD','RS');document.getElementById('FC').className='';document.getElementById('RS').className='results';show('SS');}

function startSession(){if(mode==='flash'){startFlash();return;}quiz=sh(ALL).slice(0,sel);cur=0;ok=0;ko=0;hist=[];answered=false;hide('SS');show('QHD');show('QC','block');showQ();}

function showQ(){
  answered=false;
  const q=quiz[cur],tot=quiz.length;
  document.getElementById('FL').style.width=(cur/tot*100)+'%';
  document.getElementById('PL').textContent=(cur+1)+' / '+tot;
  document.getElementById('SC').textContent=ok;
  document.getElementById('SW').textContent=ko;
  document.getElementById('QN').textContent='Q'+(cur+1);
  document.getElementById('QT').textContent=q.title;
  document.getElementById('QX').textContent=q.text;
  const ol=document.getElementById('OP');ol.innerHTML='';
  sh(Object.keys(q.answers)).forEach((orig,i)=>{
    const d=document.createElement('div');d.className='opt';d.dataset.l=orig;
    d.innerHTML=`<div class="olt">${' ABCDE'[i+1]}</div><div class="otxt">${esc(q.answers[orig])}</div>`;
    d.onclick=()=>pick(orig,q);ol.appendChild(d);
  });
  document.getElementById('FB').className='fb';
  document.getElementById('FBC').style.display='none';
  document.getElementById('FBE').style.display='none';
  document.getElementById('BN').className='bnxt';
  document.getElementById('BTN_ROW').style.display='none';
  const c=document.getElementById('QC');c.style.animation='none';c.offsetHeight;c.style.animation='fi .3s ease';
}

const ICON_OK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const ICON_KO='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

function pick(letter,q){
  if(answered)return;answered=true;
  const good=letter===q.correct_letter;
  if(good)ok++;else ko++;
  document.querySelectorAll('#OP .opt').forEach(o=>{
    o.classList.add('done');const l=o.dataset.l;
    if(l===q.correct_letter)o.classList.add('correct');
    else if(l===letter&&!good)o.classList.add('wrong');
    else o.classList.add('dim');
  });
  const fb=document.getElementById('FB');
  if(good){fb.className='fb ok show';document.getElementById('FBH').innerHTML=ICON_OK+' Corretto!';document.getElementById('FBC').style.display='none';}
  else{fb.className='fb ko show';document.getElementById('FBH').innerHTML=ICON_KO+' Risposta errata';const fbc=document.getElementById('FBC');fbc.style.display='block';fbc.innerHTML='Risposta corretta: <strong>'+esc(q.answers[q.correct_letter])+'</strong>';}
  if(q.explanation){document.getElementById('FBE').style.display='flex';document.getElementById('FBEtxt').textContent=q.explanation;}
  hist.push({q,chosen:letter,good});
  document.getElementById('SC').textContent=ok;document.getElementById('SW').textContent=ko;
  const bn=document.getElementById('BN');bn.className='bnxt show';bn.textContent=cur===quiz.length-1?'Vedi risultati →':'Prossima →';
  document.getElementById('BTN_ROW').style.display='flex';
  setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}

function nextQ(){cur++;if(cur>=quiz.length){showResults();return;}showQ();window.scrollTo({top:0,behavior:'smooth'});}
function restartQuiz(){quiz=sh(ALL).slice(0,sel);cur=0;ok=0;ko=0;hist=[];answered=false;hide('RS');show('QHD');show('QC','block');showQ();window.scrollTo({top:0,behavior:'smooth'});}

function showResults(){
  hide('QHD','QC');document.getElementById('RS').className='results show';window.scrollTo({top:0,behavior:'smooth'});
  const tot=quiz.length,pct=Math.round(ok/tot*100);
  let title,sub;
  if(pct>=90){title='Eccellente!';sub='Preparazione solida.';}
  else if(pct>=75){title='Ottimo!';sub='Qualche argomento da ripassare.';}
  else if(pct>=60){title='Quasi!';sub='Rivedi gli argomenti errati.';}
  else{title='Da ripassare';sub='Studia ancora e riprova.';}
  document.getElementById('RT').textContent=title;document.getElementById('RSB').textContent=sub;
  document.getElementById('RP').textContent=pct+'%';document.getElementById('RF').textContent=ok+' corrette su '+tot;
  document.getElementById('STC').textContent=ok;document.getElementById('STW').textContent=ko;
  const rl=document.getElementById('RL');rl.innerHTML='';
  hist.forEach((h,i)=>{
    const d=document.createElement('div');d.className='rvi '+(h.good?'ok':'ko');
    const ct=esc(h.q.answers[h.chosen]||'—');const cc=esc(h.q.answers[h.q.correct_letter]||'');
    d.innerHTML=`<div class="rvq">Q${i+1}. ${esc(h.q.title)} — ${esc(h.q.text.substring(0,60))}${h.q.text.length>60?'…':''}</div>
      <div class="rva">${h.good
        ?`<span class="vg">${ICON_OK} ${ct}</span>`
        :`<span class="vr">${ICON_KO} ${ct}</span><br><span class="vg">${ICON_OK} ${cc}</span>`
      }</div>`;
    rl.appendChild(d);
  });
}
function restartFromResults(){restartQuiz();}

function startFlash(){fcDeck=sh(ALL).slice(0,sel);fcCur=0;hide('SS');show('FCHD');document.getElementById('FC').className='show';renderFlashcard();}
function renderFlashcard(){
  const q=fcDeck[fcCur],tot=fcDeck.length;
  document.getElementById('FCF').style.width=((fcCur+1)/tot*100)+'%';
  document.getElementById('FCPL').textContent=(fcCur+1)+' / '+tot;
  document.getElementById('FCCNT').textContent=(fcCur+1)+'/'+tot;
  document.getElementById('FCQN').textContent='Q'+(fcCur+1);
  document.getElementById('FCQT').textContent=q.title;
  document.getElementById('FCQX').textContent=q.text;
  const ol=document.getElementById('FCOP');ol.innerHTML='';
  Object.keys(q.answers).forEach((orig,i)=>{
    const isC=orig===q.correct_letter;
    const d=document.createElement('div');
    d.className='opt done'+(isC?' correct':' dim');
    d.innerHTML=`<div class="olt">${'ABCDE'[i]}</div><div class="otxt">${esc(q.answers[orig])}</div>`;
    ol.appendChild(d);
  });
  document.getElementById('FCPREV').disabled=(fcCur===0);
  document.getElementById('FCNEXT').disabled=(fcCur===tot-1);
  const c=document.getElementById('FCC');c.style.animation='none';c.offsetHeight;c.style.animation='fi .3s ease';
  window.scrollTo({top:0,behavior:'smooth'});
}
function fcNav(dir){fcCur=Math.max(0,Math.min(fcDeck.length-1,fcCur+dir));renderFlashcard();}
function restartFlash(){fcDeck=sh(ALL).slice(0,sel);fcCur=0;renderFlashcard();}

function openSearch(){hide('SS');document.getElementById('SV').style.display='block';renderSearch('');setTimeout(()=>{const i=document.getElementById('SVI');if(i)i.focus();},50);}
function closeSearch(){document.getElementById('SV').style.display='none';show('SS');}
function clearSearch(){const i=document.getElementById('SVI');i.value='';renderSearch('');i.focus();}
function svHL(s,q){const e=esc(s);if(!q)return e;const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return e.replace(re,'<mark>$1</mark>');}
function renderSearch(q){
  q=(q||'').trim();
  const ql=q.toLowerCase();
  const list=document.getElementById('SVL');
  const meta=document.getElementById('SVM');
  document.getElementById('SVCL').style.display=q?'block':'none';
  const res=ql?ALL.map((it,i)=>({it,i})).filter(({it})=>{
    if((it.title||'').toLowerCase().includes(ql))return true;
    if((it.text||'').toLowerCase().includes(ql))return true;
    if((it.explanation||'').toLowerCase().includes(ql))return true;
    return Object.values(it.answers||{}).some(a=>String(a).toLowerCase().includes(ql));
  }):ALL.map((it,i)=>({it,i}));
  meta.textContent=res.length+' / '+ALL.length+' domande';
  if(!res.length){list.innerHTML='<div class="sv-empty">Nessuna domanda trovata.</div>';return;}
  list.innerHTML=res.map(({it,i})=>{
    const ans=Object.keys(it.answers||{}).map((k,j)=>{
      const isC=k===it.correct_letter;
      return `<div class="sv-ans${isC?' correct':''}"><div class="lt">${'ABCDE'[j]}</div><div>${svHL(it.answers[k],q)}</div></div>`;
    }).join('');
    const expl=it.explanation?`<div class="sv-expl">${svHL(it.explanation,q)}</div>`:'';
    return `<div class="sv-item" onclick="this.classList.toggle('open')">
      <div class="sv-item-hdr"><div class="sv-num">Q${i+1}</div><div class="sv-title">${svHL(it.title||'',q)}</div></div>
      <div class="sv-text">${svHL(it.text||'',q)}</div>
      <div class="sv-body">${ans}${expl}</div>
    </div>`;
  }).join('');
}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='SVI')renderSearch(e.target.value);});

// PWA service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
